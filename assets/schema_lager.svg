<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 290">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#b03a2e"/>
    </marker>
  </defs>
  <rect width="380" height="290" fill="#ffffff"/>

  <!-- Profil (Vorderansicht) -->
  <path d="M90,200 L250,200 L250,180 A40,40 0 0 0 238.3,151.7 L198.3,111.7 A40,40 0 0 0 141.7,111.7 L101.7,151.7 A40,40 0 0 0 90,180 Z"
        fill="#e8f0f8" stroke="#1f3f5f" stroke-width="2" stroke-linejoin="round"/>

  <!-- Bohrung -->
  <circle cx="170" cy="140" r="9" fill="#ffffff" stroke="#1f3f5f" stroke-width="1.6"/>

  <!-- Mittelachse -->
  <line x1="170" y1="90" x2="170" y2="215" stroke="#666" stroke-width="1" stroke-dasharray="10 3 2 3"/>

  <!-- Maß 40 -->
  <g stroke="#b03a2e" stroke-width="0.8" fill="none">
    <line x1="90" y1="202" x2="90" y2="226"/>
    <line x1="250" y1="202" x2="250" y2="226"/>
    <line x1="90" y1="220" x2="250" y2="220" marker-start="url(#ar)" marker-end="url(#ar)"/>
  </g>
  <rect x="161" y="209" width="18" height="11" fill="#fff"/>
  <text x="170" y="218" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9.5" fill="#b03a2e" font-weight="600">40</text>

  <!-- Maß 5 -->
  <g stroke="#b03a2e" stroke-width="0.8" fill="none">
    <line x1="88" y1="200" x2="66" y2="200"/>
    <line x1="88" y1="180" x2="66" y2="180"/>
    <line x1="72" y1="200" x2="72" y2="180" marker-start="url(#ar)" marker-end="url(#ar)"/>
  </g>
  <rect x="63" y="184" width="12" height="11" fill="#fff"/>
  <text x="69" y="193" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" fill="#b03a2e" font-weight="600">5</text>

  <!-- Maß 25 -->
  <g stroke="#b03a2e" stroke-width="0.8" fill="none">
    <line x1="252" y1="200" x2="286" y2="200"/>
    <line x1="252" y1="100" x2="286" y2="100"/>
    <line x1="280" y1="200" x2="280" y2="100" marker-start="url(#ar)" marker-end="url(#ar)"/>
  </g>
  <rect x="275" y="144" width="12" height="13" fill="#fff"/>
  <text x="281" y="154" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" fill="#b03a2e" font-weight="600">25</text>

  <!-- Maß 15 (Bohrungsmitte) -->
  <g stroke="#b03a2e" stroke-width="0.8" fill="none">
    <line x1="196" y1="140" x2="240" y2="140"/>
    <line x1="196" y1="200" x2="240" y2="200"/>
    <line x1="235" y1="140" x2="235" y2="200" marker-start="url(#ar)" marker-end="url(#ar)"/>
  </g>
  <rect x="229" y="164" width="13" height="11" fill="#fff"/>
  <text x="235.5" y="173" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" fill="#b03a2e" font-weight="600">15</text>

  <!-- R10 Bogen -->
  <line x1="170" y1="100" x2="170" y2="140" stroke="#b03a2e" stroke-width="0.8" marker-end="url(#ar)"/>
  <rect x="174" y="116" width="21" height="11" fill="#fff"/>
  <text x="184" y="125" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" fill="#b03a2e" font-weight="600">R10</text>

  <!-- R10 Schulter -->
  <line x1="210" y1="180" x2="236" y2="160" stroke="#b03a2e" stroke-width="0.8" marker-end="url(#ar)"/>
  <rect x="226" y="170" width="21" height="11" fill="#fff"/>
  <text x="236" y="179" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" fill="#b03a2e" font-weight="600">R10</text>

  <!-- Bohrung Ø4,5 -->
  <line x1="170" y1="140" x2="128" y2="128" stroke="#b03a2e" stroke-width="0.8" marker-end="url(#ar)"/>
  <rect x="83" y="118" width="34" height="11" fill="#fff"/>
  <text x="100" y="127" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" fill="#b03a2e" font-weight="600">Ø4,5</text>

  <!-- Seitenansicht (Dicke) -->
  <g>
    <rect x="302" y="150" width="26" height="46" fill="#e8f0f8" stroke="#1f3f5f" stroke-width="2"/>
    <path d="M302,150 h26" stroke="#1f3f5f" stroke-width="2"/>
    <g stroke="#b03a2e" stroke-width="0.8" fill="none">
      <line x1="300" y1="198" x2="296" y2="210"/>
      <line x1="330" y1="198" x2="334" y2="210"/>
      <line x1="296" y1="206" x2="334" y2="206" marker-start="url(#ar)" marker-end="url(#ar)"/>
    </g>
    <rect x="303" y="212" width="24" height="11" fill="#fff"/>
    <text x="315" y="221" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" fill="#b03a2e" font-weight="600">10</text>
    <text x="315" y="145" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="8" fill="#555">Dicke</text>
  </g>

  <text x="16" y="266" font-family="Segoe UI, sans-serif" font-size="8" fill="#666">Maße in mm · Bogenform 40 × 25, symmetrisch 10 mm dick</text>
</svg>
