<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 410" role="img" aria-label="Gummiprofil: Kreis R1,75 bei 18,5 mm von der Achse">
  <rect width="340" height="410" fill="#ffffff"/>
  <!-- Radprofil -->
  <path d="M140,80 L164,80 Q200,104 236,80 L260,80 L260,328 L236,328 L236,360 L164,360 L164,328 L72,328 L72,296 L140,296 Z"
        fill="#eef3f8" stroke="#17202b" stroke-width="3"/>
  <!-- Achse -->
  <line x1="30" y1="360" x2="315" y2="360" stroke="#d33a3a" stroke-width="2" stroke-dasharray="10 6"/>
  <line x1="72" y1="45" x2="72" y2="400" stroke="#2f8b57" stroke-width="2" stroke-dasharray="10 6"/>
  <circle cx="72" cy="360" r="4" fill="#2f8b57"/>
  <text x="78" y="382" fill="#2f8b57" font-family="Segoe UI,Arial" font-size="12">Ursprung</text>
  <!-- Gummi-Querschnitt -->
  <circle cx="200" cy="62" r="28" fill="#1f242b" stroke="#d33a3a" stroke-width="3"/>
  <circle cx="200" cy="62" r="5" fill="#d33a3a"/>
  <!-- Maß 18,5 mm -->
  <line x1="200" y1="62" x2="200" y2="360" stroke="#d33a3a" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="208" y="250" fill="#d33a3a" font-family="Segoe UI,Arial" font-size="14" font-weight="700">18,5 mm</text>
  <text x="238" y="55" fill="#d33a3a" font-family="Segoe UI,Arial" font-size="15" font-weight="700">Gummi R1,75</text>
  <text x="20" y="24" fill="#5f6b7a" font-family="Segoe UI,Arial" font-size="12">Querschnitt durch das Rad</text>
</svg>

