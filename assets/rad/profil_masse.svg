<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 400" role="img" aria-label="Profil des Rads mit Nut R1,75, Höhe 17,5, Breite 5 und Stufen 1 und 2 mm">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d33a3a"/>
    </marker>
  </defs>
  <rect width="340" height="400" fill="#ffffff"/>
  <!-- Profil -->
  <path d="M140,60 L164,60 Q200,84 236,60 L260,60 L260,308 L236,308 L236,340 L164,340 L164,308 L72,308 L72,276 L140,276 Z"
        fill="#eef3f8" stroke="#17202b" stroke-width="3"/>
  <!-- Achse -->
  <line x1="30" y1="340" x2="315" y2="340" stroke="#d33a3a" stroke-width="2" stroke-dasharray="10 6"/>
  <line x1="72" y1="30" x2="72" y2="385" stroke="#2f8b57" stroke-width="2" stroke-dasharray="10 6"/>
  <circle cx="72" cy="340" r="4" fill="#2f8b57"/>
  <text x="78" y="362" fill="#2f8b57" font-family="Segoe UI,Arial" font-size="12">Ursprung</text>
  <text x="300" y="332" fill="#d33a3a" font-family="Segoe UI,Arial" font-size="12">Achse</text>

  <!-- 5 mm Topbreite -->
  <line x1="140" y1="36" x2="260" y2="36" stroke="#d33a3a" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <line x1="140" y1="30" x2="140" y2="60" stroke="#d33a3a" stroke-width="1.3"/>
  <line x1="260" y1="30" x2="260" y2="60" stroke="#d33a3a" stroke-width="1.3"/>
  <text x="190" y="26" fill="#d33a3a" font-family="Segoe UI,Arial" font-size="14" font-weight="700">5</text>

  <!-- 17,5 Höhe -->
  <line x1="292" y1="60" x2="292" y2="340" stroke="#d33a3a" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <line x1="266" y1="60" x2="300" y2="60" stroke="#d33a3a" stroke-width="1.3"/>
  <line x1="266" y1="340" x2="300" y2="340" stroke="#d33a3a" stroke-width="1.3"/>
  <text x="304" y="206" fill="#d33a3a" font-family="Segoe UI,Arial" font-size="14" font-weight="700" transform="rotate(90 304 206)">17,5</text>

  <!-- 1 mm Topflat -->
  <line x1="140" y1="50" x2="164" y2="50" stroke="#d33a3a" stroke-width="1.8" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="128" y="47" fill="#d33a3a" font-family="Segoe UI,Arial" font-size="12" font-weight="700">1</text>

  <!-- R1,75 Nut -->
  <line x1="180" y1="190" x2="200" y2="74" stroke="#d33a3a" stroke-width="1.5"/>
  <text x="115" y="195" fill="#d33a3a" font-family="Segoe UI,Arial" font-size="13" font-weight="700">R1,75</text>

  <!-- 2 mm linke Stufe -->
  <line x1="46" y1="276" x2="46" y2="308" stroke="#d33a3a" stroke-width="1.8" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <line x1="42" y1="276" x2="72" y2="276" stroke="#d33a3a" stroke-width="1.2"/>
  <line x1="42" y1="308" x2="72" y2="308" stroke="#d33a3a" stroke-width="1.2"/>
  <text x="28" y="297" fill="#d33a3a" font-family="Segoe UI,Arial" font-size="12" font-weight="700">2</text>

  <!-- 2 mm Bodenflansch -->
  <line x1="58" y1="308" x2="58" y2="340" stroke="#d33a3a" stroke-width="1.8" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <line x1="54" y1="308" x2="72" y2="308" stroke="#d33a3a" stroke-width="1.2"/>
  <line x1="54" y1="340" x2="72" y2="340" stroke="#d33a3a" stroke-width="1.2"/>
  <text x="60" y="328" fill="#d33a3a" font-family="Segoe UI,Arial" font-size="12" font-weight="700">2</text>

  <!-- 1 mm rechte Stufe -->
  <line x1="248" y1="308" x2="248" y2="340" stroke="#d33a3a" stroke-width="1.8" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <line x1="240" y1="308" x2="260" y2="308" stroke="#d33a3a" stroke-width="1.2"/>
  <line x1="240" y1="340" x2="260" y2="340" stroke="#d33a3a" stroke-width="1.2"/>
  <text x="252" y="328" fill="#d33a3a" font-family="Segoe UI,Arial" font-size="12" font-weight="700">1</text>

  <text x="18" y="22" fill="#5f6b7a" font-family="Segoe UI,Arial" font-size="12">Alle Maße in mm</text>
</svg>

